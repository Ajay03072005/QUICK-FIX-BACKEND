spring.application.name=Quick-fix
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8082}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quickfixfinal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ajay}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_mockkey12345}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:mocksecretkey12345}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:whsec_mocksecret12345}
