services:
  - type: web
    name: quickfix-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:quickfix;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.h2.Driver
      - key: APP_JWT_SECRET
        generateValue: true
      - key: WEBSOCKET_ALLOWED_ORIGINS
        sync: false
